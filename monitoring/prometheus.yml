global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "taskapi-production"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]

  - job_name: "taskapi-staging"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5001"]
