services:
  staging:
    image: taskapi:${IMAGE_TAG:-latest}
    container_name: taskapi-staging
    ports:
      - "5001:5000"
    volumes:
      - staging-data:/data
    environment:
      - TASKAPI_DB=/data/tasks.db
    restart: unless-stopped
    profiles: ["staging"]

  production:
    image: taskapi:${IMAGE_TAG:-latest}
    container_name: taskapi-production
    ports:
      - "5000:5000"
    volumes:
      - production-data:/data
    environment:
      - TASKAPI_DB=/data/tasks.db
    restart: unless-stopped
    profiles: ["production"]

  # --- Optional: only needed if you go for the fuller Prometheus/Grafana
  # monitoring setup described in SETUP_GUIDE.md (pushes Monitoring stage
  # towards the High/Top HD band). Not required for a working pipeline.
  prometheus:
    image: prom/prometheus:latest
    container_name: taskapi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: taskapi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    profiles: ["monitoring"]

volumes:
  staging-data:
  production-data:
