# Only needed if you enable the SonarQube stage in the Jenkinsfile.
# sonar.projectKey and sonar.host.url can point at either:
#  - a local SonarQube server (docker run -d -p 9000:9000 sonarqube:community)
#  - SonarCloud (https://sonarcloud.io) with sonar.host.url=https://sonarcloud.io
#    and sonar.organization=<your-org>
sonar.projectKey=taskapi
sonar.projectName=Task Manager API
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=reports/coverage.xml
